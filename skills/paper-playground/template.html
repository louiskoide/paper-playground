<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; worker-src blob:">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%%TITLE%%</title>
<style>
:root{--page:#e9eaea;--panel:#f6f6f5;--line:#7d8083;--dim:#d6d8d9;--text:#5a5d60;--live:#111213;--a:#2a78d6;--b:#eb6834;--good:#006300;--neg:#b5583c;--bad:#d03b3b;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#0c0d0e;--panel:#141516;--line:#6f7276;--dim:#2a2c2e;--text:#9b9ea2;--live:#f3f3f1;--a:#3987e5;--b:#d95926;--good:#3fbf3f;--neg:#e08a6c;--bad:#f07272;color-scheme:dark}}
:root[data-theme=dark]{--page:#0c0d0e;--panel:#141516;--line:#6f7276;--dim:#2a2c2e;--text:#9b9ea2;--live:#f3f3f1;--a:#3987e5;--b:#d95926;--good:#3fbf3f;--neg:#e08a6c;--bad:#f07272;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);font:13px/1.5 var(--mono)}
/* one plate: caption, figure, caption; then the controls; then the paper's own words, folded */
.plate{max-width:1000px;margin:20px auto;padding:22px 26px 18px;background:var(--panel);border:1px solid var(--dim);border-radius:22px}
@media (max-width:640px){.plate{margin:0;border-radius:0;border-width:0 0 1px;padding:14px 16px}}
.cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.cap .fig,.cap .readout{text-transform:none;letter-spacing:.05em}
.cap .fig{color:var(--live)}
.cap .title,.cap .readout{margin-left:auto;text-align:right}
.cap .readout{color:var(--live);font-variant-numeric:tabular-nums}
.cap .keep{text-transform:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.intro{display:flex;flex-direction:column;gap:6px;margin:18px 0 6px}
.intro p{margin:0;max-width:78ch}
.lead{color:var(--live);font-size:14px}
.look{color:var(--line)}
.stage{min-width:0;margin:14px 0 10px}
canvas{display:block;width:100%;touch-action:none;border-radius:6px}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.stages button.pending{opacity:.45}
.stages[hidden],.transport[hidden],.steps[hidden],.key[hidden]{display:none}
.key{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:6px;font-size:12px}
.sw{display:inline-block;width:18px;height:2px;margin-right:8px;vertical-align:middle;background:var(--c)}
button{font:inherit;font-size:12px;color:var(--text);background:none;border:1px solid var(--dim);border-radius:8px;padding:5px 10px;min-width:34px;cursor:pointer}
button:hover{border-color:var(--line);color:var(--live)}
button[aria-pressed=true],.stages button.on{border-color:var(--live);color:var(--live)}
.controls{display:flex;flex-direction:column;gap:14px;margin-top:18px;padding-top:18px;border-top:1px solid var(--dim)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.steps,.transport{display:flex;flex-wrap:wrap;gap:8px}
.step{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px}
.step .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.step[aria-pressed=true]{border-color:var(--c);color:var(--live)}
.note{border-left:2px solid var(--c,var(--dim));padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px;min-height:2.6em}
.note p{margin:0;max-width:80ch}
.hint{color:var(--line)}
.ctext{color:var(--live)}
.result{font-variant-numeric:tabular-nums}
.result span{display:block}
.result .ok{color:var(--good)}
.result .bad{color:var(--bad)}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 28px}
.param{display:flex;flex-direction:column;gap:4px;min-width:0}
.phead{display:flex;align-items:baseline;gap:8px}
.plabel{flex:1;font-size:12px;letter-spacing:.04em}
.pval{color:var(--live);font-variant-numeric:tabular-nums}
.src{font-size:10.5px;color:var(--line);border:1px solid var(--dim);border-radius:5px;padding:0 4px;cursor:help;max-width:8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phint{margin:0;font-size:11.5px;color:var(--line);overflow-wrap:anywhere}
.take{margin-top:18px;padding-top:16px;border-top:1px solid var(--dim)}
.take p{margin:0;max-width:80ch}
.take p:last-child{color:var(--live)}
.shead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--line);margin-bottom:4px!important}
.more{margin-top:16px;padding-top:12px;border-top:1px solid var(--dim)}
.more summary{cursor:pointer;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--line)}
.more summary:hover{color:var(--live)}
.mbody{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.mbody p{margin:0;max-width:80ch}
.mbody .shead{margin-top:10px!important}
.quote{font-size:11.5px;color:var(--line);overflow-wrap:anywhere}
.terms{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:12px;max-width:80ch}
.terms b{font-weight:normal;color:var(--live)}
input[type=range]{width:100%;margin:0;accent-color:var(--live)}
input[type=checkbox]{margin:0;accent-color:var(--live)}
select{font:inherit;font-size:12px;background:var(--panel);color:var(--live);border:1px solid var(--dim);border-radius:6px;padding:3px 6px}
:focus-visible{outline:1px solid var(--live);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script>window.__PP_SPEC__ = %%SPEC%%;</script>
<script>%%KERNEL%%</script>
<script>%%PLAYGROUND%%</script>
</body>
</html>
