<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; worker-src blob:">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%%TITLE%%</title>
<style>
:root{--page:#e9eaea;--panel:#f6f6f5;--line:#7d8083;--dim:#d6d8d9;--text:#5a5d60;--live:#111213;--neg:#b5583c;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--page:#0c0d0e;--panel:#141516;--line:#6f7276;--dim:#2a2c2e;--text:#9b9ea2;--live:#f3f3f1;--neg:#e08a6c;color-scheme:dark}}
:root[data-theme=dark]{--page:#0c0d0e;--panel:#141516;--line:#6f7276;--dim:#2a2c2e;--text:#9b9ea2;--live:#f3f3f1;--neg:#e08a6c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);font:13px/1.45 var(--mono)}
.plate{max-width:1080px;margin:16px auto;padding:14px 18px 12px;background:var(--panel);border:1px solid var(--dim);border-radius:16px}
@media (max-width:640px){.plate{margin:0;border-radius:0;border-width:0 0 1px;padding:12px 16px}}
.cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.cap .fig,.cap .readout{text-transform:none;letter-spacing:.05em}
.cap .title,.cap .readout{margin-left:auto;text-align:right}
.cap .readout{color:var(--live);font-variant-numeric:tabular-nums}
.cap .keep{text-transform:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.body{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;margin:12px 0}
@media (max-width:760px){.body{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0}
canvas{display:block;width:100%;touch-action:none;border-radius:6px}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.stages button.pending{opacity:.45}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.transport{display:flex;gap:6px}
.transport[hidden],.stages[hidden]{display:none}
button{font:inherit;font-size:12px;color:var(--text);background:none;border:1px solid var(--dim);border-radius:8px;padding:4px 9px;min-width:34px;cursor:pointer}
button:hover{border-color:var(--line);color:var(--live)}
button[aria-pressed=true],.stages button.on{border-color:var(--live);color:var(--live)}
.params{display:flex;flex-direction:column;gap:12px}
.param{display:flex;flex-direction:column;gap:4px}
.phead{display:flex;align-items:baseline;gap:8px}
.plabel{flex:1;font-size:12px;letter-spacing:.04em}
.pval{color:var(--live);font-variant-numeric:tabular-nums}
.src{font-size:10.5px;color:var(--line);border:1px solid var(--dim);border-radius:5px;padding:0 4px;cursor:help}
input[type=range]{width:100%;margin:0;accent-color:var(--live)}
input[type=checkbox]{margin:0;accent-color:var(--live)}
select{font:inherit;font-size:12px;background:var(--panel);color:var(--live);border:1px solid var(--dim);border-radius:6px;padding:3px 6px}
:focus-visible{outline:1px solid var(--live);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script>window.__PP_SPEC__ = %%SPEC%%;</script>
<script>%%KERNEL%%</script>
<script>%%PLAYGROUND%%</script>
</body>
</html>
